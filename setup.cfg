[metadata]
name = multiqc-mymodule
version = 0.1.0
description = MultiQC plugin: CSV table + bar charts

[options]
packages = find:
install_requires =
    multiqc==1.14.*
include_package_data = True

[options.packages.find]
include = multiqc_mymodule*

[options.entry_points]
multiqc.modules.v1 =
    mymodule = multiqc_mymodule.modules.mymodule.mymodule:MultiqcModule
